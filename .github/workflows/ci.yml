name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso mtools build-essential netcat-openbsd
      - run: rustup show   # installs the pinned toolchain + target from rust-toolchain.toml
      - run: cargo fmt --check && cargo clippy -- -D warnings
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-output, path: build/test }
